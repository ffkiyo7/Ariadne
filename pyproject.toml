[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne"
version = "0.1.0"
description = "Owner-controlled, recoverable development workflow orchestrator"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.5,<3",
]

[project.scripts]
ariadne = "ariadne.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
