[project]
id = "luxraykit"

[git]
remote = "origin"
base_branch = "main"
branch_prefix = "pipeline/"

[workflow]
plan_directory = "docs/plans"
task_directory = "docs/tasks"
protected_sibling_checkouts = ["LuxrayKit-maintenance"]
preview_required = true
# Shared worker journal: silently added to every TASK allowlist so Hermes can
# append reviewed findings.  AGENTS.md stays owner-curated and is not writable.
knowledge_file = "docs/dev-knowledge.md"
